<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runway Rivals</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f8;--card:#fff;--ink:#2a1646;--pink:#ff3d8b;--lav:#b9a7ff;--sun:#ffe45e;--mute:#7a6a94;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1030;--card:#2b1a47;--ink:#fff1f8;--mute:#b9a7d6}}
:root[data-theme="dark"]{--bg:#1c1030;--card:#2b1a47;--ink:#fff1f8;--mute:#b9a7d6}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Bagel Fat One',Nunito,sans-serif;font-weight:400;margin:0;letter-spacing:.01em}
#app{max-width:980px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.logo{font-size:26px;color:var(--pink)}
.btn{font:800 16px Nunito,sans-serif;border:3px solid var(--ink);background:var(--sun);color:#2a1646;border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}.btn.ghost{background:var(--card);color:var(--ink)}
.btn:focus-visible,.card:focus-visible{outline:4px solid var(--lav);outline-offset:2px}
.btn:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:10px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.card.sel{background:var(--sun);color:#2a1646;box-shadow:0 4px 0 var(--ink)}
.card small{display:block;color:var(--mute);font-weight:600}.card.sel small{color:#4a3566}
.hero{text-align:center;padding:10px 0 18px}.hero h1{font-size:clamp(40px,9vw,76px);color:var(--pink);line-height:1;transform:rotate(-2deg)}
.map{display:grid;gap:12px}
.lv{display:flex;gap:12px;align-items:center;text-align:left;padding:14px}
.lv .pin{font-size:34px;min-width:44px;text-align:center}.lv.lock{opacity:.5;cursor:not-allowed}
.stars{letter-spacing:2px;color:#e8a800}
.game{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:16px}
@media(max-width:700px){.game{grid-template-columns:1fr}}
.stage{background:linear-gradient(180deg,var(--lav),var(--pink));border:3px solid var(--ink);border-radius:26px;padding:8px;text-align:center;color:#fff}
.stage svg{width:100%;max-height:420px}
.banner{background:var(--card);border:3px dashed var(--pink);border-radius:18px;padding:10px 14px;margin-bottom:10px}
.tag{display:inline-block;background:var(--lav);color:#2a1646;border-radius:99px;padding:2px 10px;margin:2px;font-size:14px;font-weight:800}
.tabs{display:flex;gap:8px;margin:8px 0}.tabs .btn{padding:6px 14px;font-size:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);margin:0 auto 4px}
.run{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.walk{animation:walk 1.4s ease-out both}
@keyframes walk{from{transform:translateY(50px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.judges{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}
.j{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:8px 4px;text-align:center;font-size:13px}
.j b{display:block;font:400 34px 'Bagel Fat One',sans-serif;color:var(--pink);min-height:42px}
.j.pop b{animation:pop .5s}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
.score{font:400 44px 'Bagel Fat One',sans-serif}
.res{text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:16px;margin-top:10px}
@media(prefers-reduced-motion:reduce){.walk,.j.pop b{animation:none}}
</style></head>
<body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const MODELS=[
{n:'Amara',e:'Nigerian',skin:'#6b4226',hair:'#1a1020',hs:'curl'},
{n:'Mei',e:'Chinese',skin:'#f2d2b0',hair:'#15101c',hs:'long'},
{n:'Sofia',e:'Brazilian',skin:'#c68a5a',hair:'#4a2616',hs:'wave'},
{n:'Priya',e:'Indian',skin:'#a8693e',hair:'#1c0f14',hs:'long'},
{n:'Zara',e:'Egyptian',skin:'#d3a070',hair:'#2a1a12',hs:'bob'},
{n:'Elena',e:'Swedish',skin:'#fbe0cf',hair:'#e8c36a',hs:'wave'}];
const SH=[['Heels','#c0264b','chic glam elegant royal'],['Sneakers','#ffffff','pop quirky futuristic'],['Boots','#222','bold futuristic chic'],['Sandals','#e8a33d','festive bright print'],['Flats','#dd99aa','classic ornate']];
const AC=[['None','','',''],['Pearls','pearl','chic classic elegant'],['Crown','crown','royal glam ornate'],['Shades','shade','pop chic bold'],['Feathers','feath','festive bold bright'],['Visor','visor','futuristic quirky'],['Scarf','scarf','print classic ornate']];
const LV=[
{c:'Paris',pin:'🗼',th:'Parisian Chic',w:'chic elegant classic',d:'Maison Éclat',rv:3,
 dr:[['Noir Trench Gown','#1d1d27','gown','chic elegant classic',1],['Rose Mini','#f4a6c0','mini','chic bright',1],['Tweed Suit','#c9b79c','suit','classic chic',1],['Neon Hoodie Dress','#7cff3a','mini','pop quirky',0],['Wine Cape Wrap','#7a1f3d','wrap','elegant royal',1]]},
{c:'Tokyo',pin:'🗾',th:'Harajuku Pop',w:'pop quirky bright',d:'Sakura Atelier',rv:4,
 dr:[['Candy Tutu','#ff8fd0','mini','pop quirky bright',1],['Cyber Jumpsuit','#38e0ff','suit','futuristic quirky',1],['Kimono Wrap','#e24a6a','wrap','classic print ornate',0],['Plain Beige Gown','#d8c8b0','gown','classic elegant',0],['Rainbow Pinafore','#ffd23f','mini','pop bright bold',1]]},
{c:'Lagos',pin:'🌍',th:'Afro Royalty',w:'bold royal print',d:'Adire House',rv:5,
 dr:[['Adire Gown','#1f5fbf','gown','print bold royal',1],['Gold Kente Wrap','#e8a800','wrap','royal print ornate',1],['Ankara Mini','#ff6a2b','mini','print bright bold',1],['Grey Blazer Suit','#8a8a95','suit','classic chic',0],['Emerald Cape Gown','#0f8a5f','gown','royal glam bold',1]]},
{c:'Mumbai',pin:'🕌',th:'Bollywood Glam',w:'glam ornate bright',d:'Rangeela Studio',rv:6,
 dr:[['Sequin Lehenga','#d6246e','gown','glam ornate bright',1],['Zari Sari Wrap','#f0a020','wrap','ornate royal glam',1],['Peacock Mini','#0fa3a3','mini','bright ornate',1],['Denim Suit','#4a6a9a','suit','pop chic',0],['Ruby Anarkali','#a8143c','gown','glam ornate royal',1]]},
{c:'Rio',pin:'🏖️',th:'Carnival Night',w:'festive bright bold',d:'Samba Atelier',rv:7,
 dr:[['Feather Samba Set','#ff4d6d','mini','festive bold bright',1],['Sunburst Gown','#ffb400','gown','festive bright glam',1],['Tropical Wrap','#13b57a','wrap','print festive bright',1],['Office Suit','#444','suit','classic chic',0],['Confetti Mini','#a85cff','mini','pop festive',1]]},
{c:'New York',pin:'🗽',th:'Future Gala',w:'futuristic glam bold',d:'Neon Avenue',rv:8,
 dr:[['Chrome Gown','#c9d4e8','gown','futuristic glam bold',1],['Hologram Mini','#7d6bff','mini','futuristic pop glam',1],['Midnight Tux Suit','#14142a','suit','chic bold futuristic',1],['Boho Wrap','#b88a5a','wrap','print classic',0],['Laser Cape Gown','#ff3d8b','gown','bold glam futuristic',1]]}];
const JG=[['Madame Vogue','fit'],['Kai Lo','acc'],['Dr. Hue','col'],['Sasha Stitch','shoe'],['Big Bella','dress']];
let S={m:0,lv:0,dr:0,sh:0,ac:0,tab:'dr',prog:(function(){try{return JSON.parse(localStorage.getItem('rr')||'')}catch(e){return null}})()||{un:0,st:[0,0,0,0,0,0]}};
function save(){try{localStorage.setItem('rr',JSON.stringify(S.prog))}catch(e){}}
const match=(t,w)=>t.split(' ').filter(x=>w.split(' ').includes(x)).length;
function parts(L,o){const d=o.d,dm=Math.min(2,match(d[3],L.w))/2*10,sm=Math.min(1,match(SH[o.sh][2],L.w))*10,am=Math.min(1,match(AC[o.ac][2],L.w))*10;
 const col=d[4]?10:4,fit=Math.min(10,dm*.6+sm*.15+am*.15+(d[4]?1:0)+0);return{fit,dress:dm,shoe:sm,acc:am,col}}
function judge(L,o){const p=parts(L,o);return JG.map(j=>{const v=.5*p.fit+.5*p[j[1]]+R(-1,1);return Math.max(1,Math.min(10,Math.round(v)))})}
function fig(m,o,w){const d=o.d,sh=SH[o.sh],ac=AC[o.ac][1],sk=m.skin,H=m.hair;let s='<svg viewBox="0 0 120 270">';
 const hb={curl:'<circle cx="60" cy="30" r="25" fill="'+H+'"/>',long:'<rect x="40" y="18" width="40" height="80" rx="18" fill="'+H+'"/>',wave:'<path d="M38 24q22-30 44 0v60q-8 8-14-6H52q-6 14-14 6z" fill="'+H+'"/>',bob:'<path d="M38 24q22-30 44 0v34q-22 8-44 0z" fill="'+H+'"/>'}[m.hs];
 s+=hb;
 const top=74,col=d[1],dh={gown:230,mini:150,suit:125,wrap:195}[d[2]];
 if(d[2]=='suit'){s+='<rect x="47" y="120" width="12" height="108" fill="'+col+'"/><rect x="61" y="120" width="12" height="108" fill="'+col+'"/>'}
 else{s+='<rect x="49" y="'+dh+'" width="9" height="'+(228-dh)+'" fill="'+sk+'"/><rect x="62" y="'+dh+'" width="9" height="'+(228-dh)+'" fill="'+sk+'"/>'}
 s+='<rect x="54" y="48" width="12" height="24" fill="'+sk+'"/><path d="M30 118L22 80" stroke="'+sk+'" stroke-width="8" stroke-linecap="round"/><path d="M90 118L98 80" stroke="'+sk+'" stroke-width="8" stroke-linecap="round"/>';
 const sp={gown:'M44 72h32l24 '+(dh-72)+'H20z',mini:'M44 72h32l20 '+(dh-72)+'H24z',suit:'M44 72h32l4 54H40z',wrap:'M44 72h32l16 '+(dh-72)+'H28z'}[d[2]];
 s+='<path d="'+sp+'" fill="'+col+'" stroke="rgba(0,0,0,.25)" stroke-width="2"/>';
 if(d[2]=='wrap')s+='<path d="M44 72l32 60" stroke="rgba(255,255,255,.55)" stroke-width="4"/>';
 s+='<circle cx="60" cy="34" r="17" fill="'+sk+'"/><circle cx="54" cy="33" r="2" fill="#2a1646"/><circle cx="66" cy="33" r="2" fill="#2a1646"/><path d="M54 41q6 5 12 0" stroke="#c03060" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
 if(m.hs=='long'||m.hs=='curl'||m.hs=='bob')s+='<path d="M43 30q17-22 34 0q-17-9-34 0z" fill="'+H+'"/>';
 s+='<ellipse cx="53" cy="234" rx="9" ry="5" fill="'+sh[1]+'" stroke="#0004"/><ellipse cx="67" cy="234" rx="9" ry="5" fill="'+sh[1]+'" stroke="#0004"/>';
 const A={pearl:'<path d="M50 62q10 10 20 0" stroke="#fff" stroke-width="4" stroke-dasharray="1 4" stroke-linecap="round" fill="none"/>',crown:'<path d="M44 20l6-14 10 10 10-10 6 14z" fill="#ffd23f" stroke="#a87b00" stroke-width="2"/>',shade:'<rect x="46" y="29" width="13" height="8" rx="3" fill="#111"/><rect x="61" y="29" width="13" height="8" rx="3" fill="#111"/>',feath:'<path d="M78 18q18-26 22 6q-12-4-22-6zM42 18q-18-26-22 6q12-4 22-6z" fill="#ff6a2b" stroke="#fff" stroke-width="1.5"/>',visor:'<rect x="42" y="26" width="36" height="9" rx="4" fill="#38e0ff" opacity=".85" stroke="#fff"/>',scarf:'<path d="M48 62q12 8 24 0l4 30-8-4-4 10-4-10-8 4z" fill="#ff8a3d"/>'};
 return s+(A[ac]||'')+'</svg>'}
const esc=s=>s;
function home(){$('#app').innerHTML=`<div class="hero"><h1>Runway Rivals</h1><p>Dress your model. Wow five judges. Beat the rival in six cities.</p></div>
<h2 style="margin:8px 0">Pick your model</h2><div class="grid">${MODELS.map((m,i)=>`<button class="card ${i==S.m?'sel':''}" onclick="S.m=${i};home()">${fig(m,{d:LV[0].dr[1],sh:0,ac:0})}<b>${m.n}</b><small>${m.e}</small></button>`).join('')}</div>
<p style="text-align:center;margin-top:18px"><button class="btn pink" onclick="mapv()">Start the tour</button></p>`}
function mapv(){$('#app').innerHTML=`<div class="top"><span class="logo">World Tour</span><button class="btn ghost" onclick="home()">Change model</button></div><div class="map">${LV.map((L,i)=>{const lk=i>S.prog.un;return`<button class="card lv ${lk?'lock':''}" ${lk?'disabled':''} onclick="start(${i})"><span class="pin">${lk?'🔒':L.pin}</span><span style="flex:1"><h3>${L.c}: ${L.th}</h3><small>Designer: ${L.d}. Rival score to beat: about ${Math.round(24+L.rv*2.8)}</small></span><span class="stars">${'★'.repeat(S.prog.st[i])}${'☆'.repeat(3-S.prog.st[i])}</span></button>`}).join('')}</div>`}
function start(i){S.lv=i;S.dr=0;S.sh=0;S.ac=0;S.tab='dr';dress()}
function dress(){const L=LV[S.lv],m=MODELS[S.m],o={d:L.dr[S.dr],sh:S.sh,ac:S.ac};
 const list=S.tab=='dr'?L.dr.map((d,i)=>[d[0],d[1],i==S.dr,i]):S.tab=='sh'?SH.map((d,i)=>[d[0],d[1],i==S.sh,i]):AC.map((d,i)=>[d[0],'#ccc',i==S.ac,i]);
 $('#app').innerHTML=`<div class="top"><span class="logo">${L.pin} ${L.c}</span><button class="btn ghost" onclick="mapv()">Back to map</button></div>
<div class="game"><div class="stage"><div id="fg">${fig(m,o)}</div><b>${m.n}</b></div><div>
<div class="banner"><h3>Theme: ${L.th}</h3>Designer collection: <b>${L.d}</b><br>Judges love: ${L.w.split(' ').map(t=>`<span class="tag">${t}</span>`).join('')}</div>
<div class="tabs">${[['dr','Dresses'],['sh','Shoes'],['ac','Accessories']].map(t=>`<button class="btn ${S.tab==t[0]?'pink':'ghost'}" onclick="S.tab='${t[0]}';dress()">${t[1]}</button>`).join('')}</div>
<div class="items">${list.map(x=>`<button class="card ${x[2]?'sel':''}" onclick="S['${S.tab}']=${x[3]};dress()">${thumb(x[3])}${x[0]}</button>`).join('')}</div>
<p><button class="btn pink" onclick="runway()">Hit the runway</button></p></div></div>`}
function runway(){const L=LV[S.lv],m=MODELS[S.m],o={d:L.dr[S.dr],sh:S.sh,ac:S.ac};
 let rm=MODELS[(S.m+1+S.lv)%6];const ro={d:pick(L.dr),sh:Math.floor(R(0,5)),ac:Math.floor(R(0,7))};
 const sc=judge(L,o),tot=sc.reduce((a,b)=>a+b,0),rs=Math.min(47,Math.round(24+L.rv*2.8+R(-4,5))),win=tot>rs;
 const stars=!win?0:tot>=42?3:tot>=35?2:1;
 $('#app').innerHTML=`<div class="top"><span class="logo">${L.pin} ${L.c} runway</span></div>
<div class="run"><div class="stage walk">${fig(m,o)}<b>${m.n} (you)</b></div><div class="stage walk" style="animation-delay:.3s">${fig(rm,ro)}<b>${rm.n} (rival)</b></div></div>
<div class="judges">${JG.map((j,i)=>`<div class="j" id="j${i}">${j[0]}<b>?</b></div>`).join('')}</div><div id="out"></div>`;
 sc.forEach((v,i)=>setTimeout(()=>{const e=$('#j'+i);e.classList.add('pop');e.querySelector('b').textContent=v},1600+i*700));
 setTimeout(()=>{if(win){S.prog.st[S.lv]=Math.max(S.prog.st[S.lv],stars);S.prog.un=Math.max(S.prog.un,Math.min(5,S.lv+1));save()}
  $('#out').innerHTML=`<div class="res"><div class="score">You ${tot} vs ${rm.n} ${rs}</div><h2>${win?'You won! '+'★'.repeat(stars):'So close. The rival edged you out.'}</h2>
  <p>${tot>=42?'The judges are speechless. Pure theme perfection.':tot>=35?'Strong look. Try matching more of the theme tags for a perfect score.':'Mismatch alert. Check the theme tags and try another combo.'}</p>
  <button class="btn ghost" onclick="dress()">Restyle</button> <button class="btn pink" onclick="${win&&S.lv<5?'start('+(S.lv+1)+')':'mapv()'}">${win&&S.lv<5?'Next city':'World map'}</button></div>`},1600+5*700+400)}
const mix=(h,t)=>{const n=parseInt(h.slice(1),16);return '#'+[n>>16,n>>8&255,n&255].map(c=>{c=t>0?c+(255-c)*t:c*(1+t);return Math.round(c).toString(16).padStart(2,'0')}).join('')};
const DR=[
[['Maison Éclat Tweed Suit','#c9a7a0','suit','classic chic elegant',1,'tweed'],['Little Black Gown','#1d1d27','gown','chic elegant classic',1,''],['Rose Polka Mini','#f4a6c0','mini','chic bright',1,'dots'],['Neon Hoodie Dress','#7cff3a','mini','pop quirky',0,''],['Burgundy Wrap Dress','#7a1f3d','wrap','elegant royal',1,'']],
[['Candy Tutu Mini','#ff8fd0','mini','pop quirky bright',1,'dots'],['Cyber Jumpsuit','#38c8e8','suit','futuristic quirky',1,'stripe'],['Sakura Kimono Wrap','#e24a6a','wrap','classic print ornate',0,'floral'],['Beige Evening Gown','#d8c8b0','gown','classic elegant',0,''],['Rainbow Stripe Mini','#ffd23f','mini','pop bright bold',1,'stripe']],
[['Adire Print Gown','#1f5fbf','gown','print bold royal',1,'wax'],['Gold Kente Wrap','#e8a800','wrap','royal print ornate',1,'zari'],['Ankara Wax Mini','#ff6a2b','mini','print bright bold',1,'wax'],['Grey Blazer Suit','#8a8a95','suit','classic chic',0,''],['Emerald Royal Gown','#0f8a5f','gown','royal glam bold',1,'seq']],
[['Sequin Lehenga Gown','#d6246e','gown','glam ornate bright',1,'seq'],['Zari Silk Saree Wrap','#f0a020','wrap','ornate royal glam',1,'zari'],['Peacock Floral Mini','#0fa3a3','mini','bright ornate',1,'floral'],['Denim Suit','#4a6a9a','suit','pop chic',0,''],['Ruby Anarkali Gown','#a8143c','gown','glam ornate royal',1,'zari']],
[['Samba Sequin Mini','#ff4d6d','mini','festive bold bright',1,'seq'],['Sunburst Gown','#ffb400','gown','festive bright glam',1,'stripe'],['Tropical Floral Wrap','#13b57a','wrap','print festive bright',1,'floral'],['Office Pinstripe Suit','#444455','suit','classic chic',0,'stripe'],['Confetti Party Mini','#a85cff','mini','pop festive',1,'dots']],
[['Chrome Sequin Gown','#c9d4e8','gown','futuristic glam bold',1,'seq'],['Hologram Mini','#7d6bff','mini','futuristic pop glam',1,'seq'],['Midnight Tux Suit','#14142a','suit','chic bold futuristic',1,''],['Boho Fringe Wrap','#b88a5a','wrap','print classic',0,'stripe'],['Laser Pink Gown','#ff3d8b','gown','bold glam futuristic',1,'seq']]];
LV.forEach((L,i)=>L.dr=DR[i]);
SH.length=0;SH.push(['Stiletto Pumps','#c0264b','chic glam elegant royal'],['Chunky Sneakers','#f4f4f8','pop quirky futuristic'],['Knee-High Boots','#2a2230','bold futuristic chic'],['Strappy Sandals','#e8a33d','festive bright print'],['Ballet Flats','#dd99aa','classic ornate']);

function home(){loadBT();$('#app').innerHTML=`<div class="hero"><h1>Runway Rivals</h1><p>Dress your model. Win over five savage judges. Conquer 6 cities, 60 levels and Fashion Week.</p></div><h2>Pick your model</h2><div class="grid">${MODELS.map((m,i)=>`<button class="card ${i==S.m?'sel':''}" onclick="S.m=${i};home()">${fig(m,{d:HOME,sh:1,ac:0})}<b>${m.n}</b><small>${m.e}</small></button>`).join('')}</div><h2 style="margin-top:14px">Meet the judges</h2><div class="judges">${JF.map((j,i)=>`<div class="j">${jface(i,1)}<b style="font-size:15px;min-height:0">${j.n}</b><small>${j.r}</small></div>`).join('')}</div><p style="text-align:center"><button class="btn pink" onclick="mapv()">Start the tour</button></p>`}
function mapv(){S.fw=null;const C=CITY[S.c],u=P.u[S.c];$('#app').innerHTML=`<div class="top"><span class="logo">World Tour</span><button class="btn ghost" onclick="home()">Change model</button></div><div class="tabs">${CITY.map((x,i)=>`<button class="btn ${i==S.c?'pink':'ghost'}" ${P.u[i]?'':'disabled'} onclick="S.c=${i};mapv()">${P.u[i]?x.pin:'🔒'} ${x.c}</button>`).join('')}</div><p><button class="btn" onclick="fwStart()">⭐ Fashion Week: dress 6 models</button></p><div class="map">${C.th.map((t,l)=>{const lk=l>=u,s=P.st[S.c+'-'+l]||0;return`<button class="card lv ${lk?'lock':''}" ${lk?'disabled':''} onclick="start(${S.c},${l})"><span class="pin">${lk?'🔒':C.pin}</span><span style="flex:1"><h3>${l+1}. ${t}</h3><small>Designer: ${C.d}</small></span><span class="stars">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span></button>`}).join('')}</div>`}
function start(c,l){S.c=c;S.l=l;S.L=mk(c,l);initD();dress()}
function fwStart(){S.fw={r:0,t:0,rt:0};fwRound()}
function fwRound(){S.L=mk(S.fw.r,4);initD();dress()}
function pickBT(i){const p=BT[i];if(p.t=='dr'){S.ad=p;S.dr=-2}else{S.si=p.img;S.sh=hs(p.title)%5}dress()}
function dress(){const L=S.L,m=cm(),o=outfit();LV[S.lv=0]=L;/* thumb() reads LV[S.lv] */
 let list;
 if(S.tab=='bt')list=(BT&&BT.length)?BT.map((p,i)=>`<button class="card" onclick="pickBT(${i})"><img src="${p.img}" alt="" style="height:72px;max-width:100%;background:#fff;border-radius:10px">${p.title}<small>${p.t=='dr'?'dress':'shoes'}</small></button>`).join(''):'<p>Loading boutique (needs internet)...</p>';
 else{const arr=S.tab=='dr'?L.dr:S.tab=='sh'?SH:AC,cur=S[S.tab];list=arr.map((d,i)=>`<button class="card ${i==cur?'sel':''}" onclick="S['${S.tab}']=${i};${S.tab=='sh'?'S.si=null;':''}dress()">${thumb(i)}${d[0]}</button>`).join('')}
 $('#app').innerHTML=`<div class="top"><span class="logo">${L.pin} ${L.c}${S.fw?' · Round '+(S.fw.r+1)+'/6':''}</span><button class="btn ghost" onclick="mapv()">${S.fw?'Quit':'Back'}</button></div><div class="game"><div class="stage">${fig(m,o)}<b>${m.n}</b></div><div><div class="banner"><h3>${L.th}</h3>Designer: <b>${L.d}</b><br>Judges love: ${L.w.split(' ').map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="tabs">${[['dr','Dresses'],['sh','Shoes'],['ac','Accessories'],['bt','Boutique']].map(t=>`<button class="btn ${S.tab==t[0]?'pink':'ghost'}" onclick="S.tab='${t[0]}';dress()">${t[1]}</button>`).join('')}</div><div class="items">${list}</div><p><button class="btn pink" ${S.dr==-1?'disabled':''} onclick="runway()">${S.dr==-1?'Pick a dress first':'Hit the runway'}</button> <a class="btn ghost" style="text-decoration:none" href="ar-tryon.html" target="_blank">Try on in AR</a></p></div></div>`}
async function runway(){const L=S.L,m=cm(),o=outfit(),rm=MODELS[(MODELS.indexOf(m)+3)%6],ro={d:pick(L.dr),sh:Math.floor(R(0,5)),ac:Math.floor(R(0,7))},base=judge(L,o);
 $('#app').innerHTML=`<div class="top"><span class="logo">${L.pin} ${L.th}</span></div><div class="run"><div class="stage walk">${fig(m,o)}<b>${m.n} (you)</b></div><div class="stage walk" style="animation-delay:.3s">${fig(rm,ro)}<b>${rm.n} (rival)</b></div></div><p id="st" style="text-align:center">The judges are whispering...</p><div class="judges">${JF.map((j,i)=>`<div class="j" id="j${i}"><div class="fc">${jface(i,-1)}</div><b>?</b><small>${j.n}</small><p></p></div>`).join('')}</div><div id="out"></div>`;
 let r={scores:base,comments:null};
 try{const ctl=new AbortController();setTimeout(()=>ctl.abort(),15000);const x=await fetch('/api/judge',{method:'POST',signal:ctl.signal,body:JSON.stringify({theme:L.th,city:L.c,themeTags:L.w,outfit:{dress:o.d[0],dressTags:o.d[3],shoes:SH[o.sh][0],accessory:AC[o.ac][0]},base,judges:JF.map(j=>j.n+' ('+j.r+')')})});if(x.ok){const j=await x.json();if(j.scores&&j.scores.length==5)r={scores:j.scores.map(v=>Math.max(1,Math.min(10,Math.round(v)))),comments:j.comments}}}catch(e){}
 const sc=r.scores,tot=sc.reduce((a,b)=>a+b,0),rs=Math.min(42,Math.round(22+L.rv*2.3+R(-3,4)));
 $('#st').textContent=r.comments?'Claude-powered judges have spoken':'The judges have spoken';
 sc.forEach((v,i)=>setTimeout(()=>{const e=$('#j'+i),md=v>=8?2:v>=5?1:0;e.classList.add('pop');e.querySelector('.fc').innerHTML=jface(i,md);e.querySelector('b').textContent=v;e.querySelector('p').textContent=(r.comments&&r.comments[i])||JC[i][md].replace('{th}',L.th)},900+i*1000));
 setTimeout(()=>finish(tot,rs,rm),5500)}
function finish(tot,rs,rm){let html,btn;const win=tot>rs;
 if(S.fw){const f=S.fw;f.t+=tot;f.rt+=rs;html=`<div class="score">Round: ${tot} vs ${rs}</div><p>Team total: You ${f.t} · Rivals ${f.rt}</p>`;
  if(f.r==5){html+=`<h2>${f.t>f.rt?'You win Fashion Week!':'The rivals take Fashion Week.'}</h2>`;btn='<button class="btn pink" onclick="mapv()">World map</button>'}
  else btn='<button class="btn pink" onclick="S.fw.r++;fwRound()">Next model</button>'}
 else{const stars=!win?0:tot>=42?3:tot>=35?2:1;
  if(win){const k=S.c+'-'+S.l;P.st[k]=Math.max(P.st[k]||0,stars);P.u[S.c]=Math.max(P.u[S.c],Math.min(10,S.l+2));if(S.l==9&&S.c<5)P.u[S.c+1]=Math.max(P.u[S.c+1],1);try{localStorage.setItem('rr2',JSON.stringify(P))}catch(e){}}
  html=`<div class="score">You ${tot} vs ${rm.n} ${rs}</div><h2>${win?'You won! '+'★'.repeat(stars):'So close. The rival edged you out.'}</h2>`;
  btn=`<button class="btn pink" onclick="${win&&S.l<9?'start('+S.c+','+(S.l+1)+')':'mapv()'}">${win&&S.l<9?'Next level':'World map'}</button>`}
 $('#out').innerHTML=`<div class="res">${html}${S.fw?'':'<button class="btn ghost" onclick="dress()">Restyle</button> '}${btn}</div>`}
home();
</script></body></html>
